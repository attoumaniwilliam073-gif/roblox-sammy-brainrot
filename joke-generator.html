<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .joke-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .joke-text {
            font-size: 1.3em;
            line-height: 1.6;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .joke-type {
            font-size: 0.9em;
            opacity: 0.8;
            font-style: italic;
        }

        .punchline {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            font-size: 1.2em;
            font-weight: 600;
        }

        .loading {
            display: none;
            color: #667eea;
            font-size: 1.2em;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .secondary-btn {
            background: #f0f0f0;
            color: #333;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .secondary-btn:hover {
            background: #e0e0e0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .category-filter {
            margin-bottom: 20px;
        }

        .category-filter label {
            color: #333;
            font-weight: 600;
            margin-right: 10px;
        }

        .category-filter select {
            padding: 8px 15px;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            background: white;
            color: #333;
        }

        .stats {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            color: #666;
            font-size: 0.9em;
        }

        .emoji {
            font-size: 3em;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .joke-text {
                font-size: 1.1em;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">😂</div>
        <h1>Joke Generator</h1>
        <p class="subtitle">Get a random laugh every time!</p>

        <div class="error" id="error"></div>

        <div class="category-filter">
            <label for="category">Category:</label>
            <select id="category">
                <option value="any">Any</option>
                <option value="general">General</option>
                <option value="programming">Programming</option>
                <option value="knock-knock">Knock-Knock</option>
            </select>
        </div>

        <div class="joke-display" id="jokeDisplay">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading a joke...</p>
            </div>
            <div id="jokeContent">
                <p class="joke-text">Click "Get Joke" to start laughing! 🎉</p>
            </div>
        </div>

        <div class="button-group">
            <button onclick="fetchJoke()" id="getJokeBtn">Get Joke 🎉</button>
            <button class="secondary-btn" onclick="copyJoke()">Copy 📋</button>
            <button class="secondary-btn" onclick="shareJoke()">Share 🔗</button>
        </div>

        <div class="stats">
            <p>Jokes loaded: <strong id="jokeCount">0</strong></p>
        </div>
    </div>

    <script>
        let currentJoke = null;
        let jokeCount = 0;

        // Fetch joke from API
        async function fetchJoke() {
            const category = document.getElementById('category').value;
            const getJokeBtn = document.getElementById('getJokeBtn');
            const loading = document.getElementById('loading');
            const jokeContent = document.getElementById('jokeContent');
            const error = document.getElementById('error');

            // Disable button and show loading
            getJokeBtn.disabled = true;
            loading.style.display = 'flex';
            jokeContent.innerHTML = '';
            error.style.display = 'none';

            try {
                let url = 'https://v2.jokeapi.dev/joke/';

                if (category === 'any') {
                    url += 'Any';
                } else if (category === 'general') {
                    url += 'General';
                } else if (category === 'programming') {
                    url += 'Programming';
                } else if (category === 'knock-knock') {
                    url += 'Knock-Knock';
                }

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();

                // Handle the response
                if (data.type === 'single') {
                    currentJoke = data.joke;
                    jokeContent.innerHTML = `<p class="joke-text">${escapeHtml(data.joke)}</p>`;
                } else if (data.type === 'twopart') {
                    currentJoke = `${data.setup}\n\n${data.delivery}`;
                    jokeContent.innerHTML = `
                        <p class="joke-text">${escapeHtml(data.setup)}</p>
                        <p class="punchline">${escapeHtml(data.delivery)}</p>
                    `;
                }

                jokeCount++;
                document.getElementById('jokeCount').textContent = jokeCount;

            } catch (err) {
                error.style.display = 'block';
                error.textContent = `Error: ${err.message}. Please try again.`;
                jokeContent.innerHTML = '<p class="joke-text">Oops! Failed to load a joke. Try again!</p>';
            } finally {
                loading.style.display = 'none';
                getJokeBtn.disabled = false;
            }
        }

        // Copy joke to clipboard
        function copyJoke() {
            if (currentJoke) {
                navigator.clipboard.writeText(currentJoke).then(() => {
                    alert('Joke copied to clipboard! 📋');
                }).catch(() => {
                    alert('Failed to copy joke');
                });
            }
        }

        // Share joke (using Web Share API if available)
        function shareJoke() {
            if (currentJoke) {
                if (navigator.share) {
                    navigator.share({
                        title: 'Check out this joke!',
                        text: currentJoke,
                        url: window.location.href
                    }).catch(err => console.log('Error sharing:', err));
                } else {
                    alert('Share not supported on this browser. Try copying instead!');
                }
            }
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Load initial joke on page load
        window.addEventListener('load', () => {
            fetchJoke();
        });

        // Allow Enter key to fetch joke
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                fetchJoke();
            }
        });
    </script>
</body>
</html>
